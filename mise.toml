[tools]
opentofu       = "1.12.6"
jq             = "1.8.2"
terraform-docs = "0.24.0"
python         = "3.12.14"
uv             = "0.12.17"
"pipx:semgrep" = "1.180.0"
# The Vault CLI, the server's version: the operator's writes and plans over WARP.
vault          = "2.0.4"

[tasks.docs]
description = "Regenerate the inputs/outputs section of every module README"
run = 'for m in modules/*/; do [ -d "$m" ] && terraform-docs markdown table --output-file README.md --output-mode inject "$m"; done'

[settings]
locked = true
