name: apply

# Only when OpenTofu could change something.
on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'policies/**'
      - 'mise.toml'
      - '.github/workflows/plan.yml'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: 0xc0-labs/.github/.github/workflows/tofu-apply.yml@main
    with:
      working-directory: environments/prod
      environment: production
      # Read-write: main only, behind the operator's approval (policies/terraform.hcl).
      vault-addr: https://vault.int.0xc0.cc
      vault-role: terraform
      vault-secrets: |
        ci/data/shared/rustfs access_key_id | AWS_ACCESS_KEY_ID ;
        ci/data/shared/rustfs secret_access_key | AWS_SECRET_ACCESS_KEY ;
